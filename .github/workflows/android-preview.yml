name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-preview.yml'
      - 'preview/**'
      - 'buildings/**/*.glb'
      - 'props/**/*.glb'
      - 'environment/vegetation/**/*.glb'

concurrency:
  group: mapa-novo-android-preview-optimized
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's|^keystore/debug=.*|keystore/debug="'$HOME'/.android/debug.keystore"|' export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg
      - name: Inventory project assets
        shell: bash
        run: |
          mkdir -p build/logs
          {
            echo "=== Complete source asset inventory (preserved) ==="
            du -sh buildings environment military props
            find buildings environment military props -type f | awk '
              { n++; ext=$0; sub(/^.*\./,"",ext); count[ext]++ }
              END { print "Total files:", n; for (ext in count) print ext ":", count[ext] }
            ' | sort
          } 2>&1 | tee build/logs/asset-inventory.log
      # Build in an isolated preview project so Godot does not import the
      # unused FBX/OBJ/HDR/audio/texture libraries from the 623 MB source kit.
      # Original source assets remain untouched in the repository.
      - name: Stage only preview GLB models
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="build/preview-project"
          mkdir -p "$PREVIEW/preview" "$PREVIEW/build"
          cp project.godot export_presets.cfg "$PREVIEW/"
          cp preview/main.tscn preview/showcase.gd "$PREVIEW/preview/"
          mapfile -t MODELS < <(find buildings props environment/vegetation -type f -iname '*.glb' | sort | head -n 72)
          if [ "${#MODELS[@]}" -eq 0 ]; then
            echo "No GLB preview models were found" >&2
            exit 1
          fi
          printf 'Staging %s GLB models (the source library is unchanged)\n' "${#MODELS[@]}" | tee build/logs/preview-staging.log
          for src in "${MODELS[@]}"; do
            mkdir -p "$PREVIEW/$(dirname "$src")"
            cp "$src" "$PREVIEW/$src"
          done
          du -sh "$PREVIEW" | tee -a build/logs/preview-staging.log
          find "$PREVIEW" -type f -name '*.glb' | wc -l | tee -a build/logs/preview-staging.log
      - name: Cache Godot preview imports
        uses: actions/cache@v4
        with:
          path: build/preview-project/.godot/
          key: ${{ runner.os }}-godot-preview-4.3.0-${{ hashFiles('project.godot', 'preview/**', 'buildings/**/*.glb', 'props/**/*.glb', 'environment/vegetation/**/*.glb') }}
          restore-keys: |
            ${{ runner.os }}-godot-preview-4.3.0-
      - name: Import preview assets
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          timeout 45m godot --verbose --headless --editor --path build/preview-project --import 2>&1 | tee build/logs/godot-import.log
      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build/logs build/preview-project/build
          set -o pipefail
          godot --verbose --headless --path build/preview-project --export-debug "Android" build/preview-project/build/mapa-novo-preview.apk 2>&1 | tee build/logs/godot-export.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-build-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-preview-apk
          path: build/preview-project/build/mapa-novo-preview.apk
          if-no-files-found: error
