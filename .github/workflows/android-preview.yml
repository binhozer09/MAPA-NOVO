name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'preview/**'
      - '.github/workflows/android-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's|^keystore/debug=.*|keystore/debug="'$HOME'/.android/debug.keystore"|' export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg
      - name: Import preview assets
        run: godot --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/mapa-novo-preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-preview-apk
          path: build/mapa-novo-preview.apk
          if-no-files-found: error
