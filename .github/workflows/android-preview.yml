name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-preview.yml'
      - 'preview/**'

concurrency:
  group: mapa-novo-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's|^keystore/debug=.*|keystore/debug="'$HOME'/.android/debug.keystore"|' export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg
      # Keep the complete Godot editor cache, not only converted textures/models.
      # This preserves the filesystem scan/import metadata between builds.
      - name: Cache Godot project imports
        uses: actions/cache@v4
        with:
          path: .godot/
          key: ${{ runner.os }}-godot-4.3.0-${{ hashFiles('project.godot', 'buildings/**', 'environment/**', 'military/**', 'props/**', 'preview/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3.0-
      - name: Inventory project assets
        shell: bash
        run: |
          mkdir -p build/logs
          {
            echo "=== Project asset inventory ==="
            du -sh buildings environment military props
            find buildings environment military props -type f | awk '
              { n++; ext=$0; sub(/^.*\./,"",ext); count[ext]++ }
              END { print "Total files:", n; for (ext in count) print ext ":", count[ext] }
            ' | sort
          } 2>&1 | tee build/logs/asset-inventory.log
      - name: Import preview assets
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          godot --verbose --headless --editor --path . --import 2>&1 | tee build/logs/godot-import.log
      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build/logs build
          set -o pipefail
          godot --verbose --headless --path . --export-debug "Android" build/mapa-novo-preview.apk 2>&1 | tee build/logs/godot-export.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-build-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-preview-apk
          path: build/mapa-novo-preview.apk
          if-no-files-found: error
