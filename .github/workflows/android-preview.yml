name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'preview/**'
      - '.github/workflows/android-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Keep only preview assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          keep = {
              Path("project.godot"),
              Path("export_presets.cfg"),
              Path("preview/main.tscn"),
              Path("preview/showcase.gd"),
          }
          model_dirs = [
              Path("buildings"),
              Path("props"),
              Path("environment/vegetation"),
          ]
          for folder in model_dirs:
              models = sorted(folder.rglob("*.glb")) if folder.exists() else []
              keep.update(models[:24])

          for path in sorted(root.rglob("*"), reverse=True):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel in keep:
                  continue
              path.unlink()
          for path in sorted(root.rglob("*"), reverse=True):
              if path.is_dir():
                  try:
                      path.rmdir()
                  except OSError:
                      pass
          print(f"Kept {sum(1 for p in keep if p.suffix == '.glb')} GLB models for the preview.")
          PY
      - name: Import preview assets
        run: godot --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/mapa-novo-preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-novo-preview-apk
          path: build/mapa-novo-preview.apk
          if-no-files-found: error
